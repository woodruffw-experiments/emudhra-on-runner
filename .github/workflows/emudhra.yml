on:
  - push
  - workflow_dispatch

permissions: {}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os:
          # - macos-latest
          - xcode-27
          - macos-26-intel
          - macos-26
          - macos-15-intel
          - macos-15
          - macos-14
          # - ubuntu-latest
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - ubuntu-slim
          # - windows-latest
          - windows-2025
          - windows-2022
          - windows-11-arm
          - windows-11-vs2026-arm
    runs-on: ${{ matrix.os }}
    steps:
      - name: test curl
        run: |
          which curl
          curl --head https://dv-g3b-aaa-emudhra.we-have-a-problem.com/
          which git
          brew info git
          git ls-remote https://git-emudhra.we-have-a-problem.com/check.git
          brew reinstall git
          git ls-remote https://git-emudhra.we-have-a-problem.com/check.git

